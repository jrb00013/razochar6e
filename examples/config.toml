# Example razochar6e config — copy to ~/.config/razochar6e/config.toml

start = 20
end = 80

# Optional: force a backend (linux_sysfs, windows_asus, windows_wmi_asus, macos_cli)
# backend = "linux_sysfs"

# Optional: Kasa plug IP for `razochar6e cycle` / `sleepcut` / `profile`
# (credentials via KASA_USERNAME / KASA_PASSWORD)
# kasa_host = "192.168.1.88"

# Last applied power profile: remote | desk | away
# active_profile = "away"
